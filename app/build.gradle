apply plugin: 'com.android.application'
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.12"
}

android {
    namespace 'com.ixuea.courses.mymusic'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ixuea.courses.mymusic"
        minSdk rootProject.ext.minSdkSersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        flavorDimensions "versionCode"

        // 注入 Git 信息，供 CoverageCollector 使用（CI 环境变量优先，本地降级到 git 命令）
        def gitHash = System.getenv("GIT_COMMIT_HASH") ?:
            "git rev-parse --short HEAD".execute([], rootDir).text.trim()
        def gitBranch = System.getenv("GIT_BRANCH") ?:
            "git rev-parse --abbrev-ref HEAD".execute([], rootDir).text.trim()
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitHash}\""
        buildConfigField "String", "GIT_BRANCH", "\"${gitBranch}\""
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        dev {
            buildConfigField('String', "ENDPOINT", '"http://dev-my-cloud-music-api-rails.ixuea.com/"')
            dimension 'versionCode'
        }
        prod {
            buildConfigField 'String', 'ENDPOINT', '"http://api-courses-misuc.ixuea.com/"'
            dimension 'versionCode'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// JaCoCo 单元测试覆盖率报告任务
// 运行: ./gradlew jacocoUnitTestReport
// 输出: app/build/reports/jacoco/jacocoUnitTestReport/jacocoUnitTestReport.xml
task jacocoUnitTestReport(type: JacocoReport, dependsOn: ['testDevDebugUnitTest']) {
    group = "Reporting"
    description = "Generate JaCoCo unit test coverage report"

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*',
        '**/coverage/**'
    ]

    classDirectories.setFrom(fileTree(
        dir: "${buildDir}/intermediates/javac/devDebug/compileDevDebugJavaWithJavac/classes",
        excludes: fileFilter
    ))

    sourceDirectories.setFrom(files(["src/main/java"]))

    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDevDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/devDebugUnitTest/testDevDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/devDebugUnitTest/*.exec'
    ]))
}

// UI 测试（connected/instrumented）覆盖率报告
// 运行: ./gradlew jacocoUITestReport
task jacocoUITestReport(type: JacocoReport) {
    group = "Reporting"
    description = "Generate JaCoCo UI/instrumented test coverage report"

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*',
        '**/coverage/**'
    ]

    classDirectories.setFrom(fileTree(
        dir: "${buildDir}/intermediates/javac/devDebug/compileDevDebugJavaWithJavac/classes",
        excludes: fileFilter
    ))

    sourceDirectories.setFrom(files(["src/main/java"]))

    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'outputs/code_coverage/devDebugAndroidTest/connected/**/*.ec'
    ]))
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.11.0'

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'me.relex:circleindicator:2.1.6'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.github.GrenderG:Toasty:1.4.2'

    implementation 'org.apache.commons:commons-lang3:3.9'

    implementation "androidx.multidex:multidex:2.0.1"

    implementation 'com.facebook.stetho:stetho:1.5.1'
    implementation 'com.facebook.stetho:stetho-okhttp3:1.5.1'

    implementation 'org.greenrobot:eventbus:3.3.1'
}
